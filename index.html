<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbejdshåndbog AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        .chatbox {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f1f3f5;
            border-radius: 10px;
            min-height: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Arbejdshåndbog AI</h1>

    <p class="subtitle">
        Spørg om telefonnumre, placeringer, procedurer og andet fra arbejdet.
    </p>

    <div class="chatbox">

        <textarea
            id="question"
            placeholder="Skriv dit spørgsmål her...">
        </textarea>

        <button onclick="askQuestion()">
            Spørg
        </button>

        <div class="answer" id="answer">
            Dit svar kommer her...
        </div>

    </div>

</div>

<script>

function askQuestion() {

    const question = document.getElementById("question").value;

    if (question.trim() === "") {
        document.getElementById("answer").innerText =
            "Skriv et spørgsmål først.";
        return;
    }

    document.getElementById("answer").innerText =
        "Vi har modtaget dit spørgsmål: " + question;

}

</script>

</body>
</html>
